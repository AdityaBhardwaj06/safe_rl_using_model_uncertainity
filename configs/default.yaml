# SafeDreamer Epistemic Cost Uncertainty Configuration
# CS F317 Reinforcement Learning | BITS Pilani

project:
  name: "SafeDreamer-Epistemic-Uncertainty"
  version: "1.0.0"
  device: "cuda"  # fallback to 'cpu' if no CUDA available

environment:
  task: "SafetyPointGoal1-v0"
  vector_obs: true           # Stage 2: true (60-dim lidar/vel); Stage 3: false (64x64 pixels)
  action_repeat: 2
  time_limit: 1000

safety:
  cost_limit: 0.0            # Target safety budget b (evaluated at 0.0, 0.5, 2.0)
  init_lambda: 0.0           # Initial dual multiplier
  lambda_lr: 1e-2            # Dual learning rate alpha_lambda
  lambda_max: 50.0

ensemble:
  num_heads: 5               # Ensemble size K in {1, 3, 5, 10}
  hidden_dim: 256
  layers: 2
  kappa: 1.0                 # Conservatism multiplier in {0.0, 0.5, 1.0, 2.0}

world_model:
  latent_dim: 1024
  horizon: 15                # Imagined rollout horizon H
  gamma: 0.99                # Discount factor
  model_lr: 3e-4
  actor_lr: 1e-4
  critic_lr: 1e-4

training:
  total_steps: 1000000       # 1M steps for full training run
  prefill_steps: 5000        # Random exploration steps before model training
  batch_size: 16
  train_every: 5             # Train world model every N environment steps
  eval_every: 10000          # Evaluate every N steps
  eval_episodes: 10
