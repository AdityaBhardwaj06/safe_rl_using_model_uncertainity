# Settings actually used by the scripts in this repo (CPU-scale pilot). Command-line flags override.
environment:
  task: SafetyPointGoal1-v0
  observation: vector            # 60-d (accelerometer, velocimeter, gyro, magnetometer, goal/hazard/vase lidar)
  time_limit: 1000

safety:
  budget_b: 25.0                 # undiscounted cost per 1000-step episode (Safety-Gymnasium convention)
  smoke_test_budgets: [0.0, 25.0]
  lambda_init: 0.0
  lambda_lr_model_based: 0.02    # per real episode
  lambda_lr_ppo_lag: 0.035       # per epoch (OmniSafe default)
  lambda_max: 50.0               # lambda is capped -> it cannot diverge to infinity

ensemble:
  num_heads: 5
  hidden_dim: 128                # 256 in exp1/exp2 (cost head on raw observations)
  kappa: [0.0, 1.0]              # mean-only vs pessimistic
  bootstrap: poisson
  prior_scale: 0.0               # 1.0 in the 'boot+prior' variant of exp2

world_model:                     # small deterministic latent model (NOT DreamerV3's RSSM)
  latent_dim: 32
  hidden: 128
  seq_len: 16
  horizon_H: 15
  gamma: 0.99
  lambda_return: 0.95
  model_lr: 3.0e-4
  actor_lr: 8.0e-5
  critic_lr: 3.0e-4

training_pilot:
  total_steps: 30000
  prefill_steps: 5000
  train_every: 10
  seeds: [0, 1]
